[project]
name = "matebridge"
version = "0.1.0"
description = "Voice bridge: phone-call an assistant that supervises coding agents in herdr"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[openai,silero]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matebridge"]
